<?xml version="1.0" encoding="UTF-8"?>
<!--
    Basket Bot launcher icon
    Approved design of record. Canvas 512 x 512. Seven shapes over the field.

    PALETTE
      field    #6b46c1   theme primary (ion-color-primary, light)
      shell    #bdb5dd   outer casing
      metal    #dcd7ef   inset faceplate
      recess   #0f0f23   visor cavity (ion-background-color, dark)
      bevel    #322b52   lit inner edge at the top of the cavity
      eye      #ff2e2e   lenses
      mouth    #6f6690   mouth line

    GEOMETRY OF RECORD
      shell      truncated cone, 272 wide at the crown to 400 at the base, height 256,
                 y 132 to 388, taper ratio 0.68, crown edge DEAD STRAIGHT and horizontal
      faceplate  the same form inset 12 units along its normals, so the shell reads as a rim
      visor      256 x 60, rx 14, y 179 to 239, with a 7 unit lit bevel inside its top edge
      lenses     r 40 half discs, flat side up, flat top at y 189,
                 centres x 178 and 334, gap 76, symmetric about x 256
      mouth      spans x 106 to 406. Level across the middle at 9 units thick.
                 The outer 40 units at each end thin to 4 and drop 5, terminal radius 2.
                 Level in the middle, symmetric, NOT a continuous arc.
      brow:chin  47 : 149  (1 : 3.2)

    The mouth's level middle and the lenses' flat tops are the expression. Do not round
    either one away.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
    <rect width="512" height="512" fill="#6b46c1" />
    <path
        d="M 177,132 L 335,132 Q 392,132 401,167 L 445,345 Q 456,388 412,388 L 100,388 Q 56,388 67,345 L 111,167 Q 120,132 177,132 Z"
        fill="#bdb5dd" />
    <path
        d="M 153.4,144 L 358.6,144 Q 382.6,144 388.4,167.3 L 433.3,346.9 Q 440.6,376 410.6,376 L 101.4,376 Q 71.4,376 78.7,346.9 L 123.6,167.3 Q 129.4,144 153.4,144 Z"
        fill="#dcd7ef" />
    <rect x="128" y="179" width="256" height="60" rx="14" fill="#0f0f23" />
    <rect x="134" y="183" width="244" height="7" rx="3" fill="#322b52" />
    <path d="M 138,189 A 40,40 0 0 0 218,189 Z" fill="#ff2e2e" />
    <path d="M 294,189 A 40,40 0 0 0 374,189 Z" fill="#ff2e2e" />
    <path
        d="M 106,271 Q 126,263.5 146,263.5 L 366,263.5 Q 386,263.5 406,271 A 2,2 0 0 1 406,275 Q 386,272.5 366,272.5 L 146,272.5 Q 126,272.5 106,275 A 2,2 0 0 1 106,271 Z"
        fill="#6f6690" />
</svg>
