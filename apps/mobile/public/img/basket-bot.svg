<?xml version="1.0" encoding="UTF-8"?>
<!--
    Basket Bot mascot - the single-colour form of the launcher icon.
    Used as LLM_ICON_SRC (see src/llm/shared/constants.ts) and tinted via currentColor,
    so the whole mark has to read in one value.

    One path, fill-rule evenodd, so the nesting does the shading:
      shell outline   -> filled
      visor cavity    -> hole
      the two lenses  -> filled again, inside the hole
      mouth           -> hole

    Geometry matches resources/icon.svg exactly. The chin plate hairline is omitted
    here - at the size this renders it would be well under a pixel.
-->
<svg viewBox="48 124 416 272" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
    fill-rule="evenodd">
    <path
        d="M 177,132 L 335,132 Q 392,132 401,167 L 445,345 Q 456,388 412,388 L 100,388 Q 56,388 67,345 L 111,167 Q 120,132 177,132 Z
           M 142,179 L 370,179 Q 384,179 384,193 L 384,225 Q 384,239 370,239 L 142,239 Q 128,239 128,225 L 128,193 Q 128,179 142,179 Z
           M 138,189 A 40,40 0 0 0 218,189 Z
           M 294,189 A 40,40 0 0 0 374,189 Z
           M 106,271 Q 126,263.5 146,263.5 L 366,263.5 Q 386,263.5 406,271 A 2,2 0 0 1 406,275 Q 386,272.5 366,272.5 L 146,272.5 Q 126,272.5 106,275 A 2,2 0 0 1 106,271 Z" />
</svg>
